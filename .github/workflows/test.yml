name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Executor concurrency contracts
        run: >-
          go test -race -count=1 ./datalog/executor
          -run '^(TestScanRegistry_ConcurrentAccess|TestScanRegistryGetOrCreateConcurrent|TestScanSharingMatcherConcurrentSameFingerprintUsesOneScan|TestLazySeq_ThreadSafe|TestConcurrentStructuredJoinAnnotations|TestRelationInputParallel_HandlesWorkspaceReuseIterator|TestRelationInputParallel_ConcurrentInvocationCorrectness|TestUnionRelation_ConcurrentIteratorWhileBuilding|TestConcurrentStreamingMaterialization)$'
      - name: Storage concurrency contracts
        run: >-
          go test -race -count=1 ./datalog/storage
          -run '^(TestTupleBuilderCacheConcurrency|TestIteratorWorkspaceConcurrency|TestCacheConcurrency|TestCommit_ConcurrentReadersSeeCommittedValue|TestTruncateToConcurrentWritersNoCollision)$'
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: js/wasm suite less the storage package (the make test gate's wasm leg)
        run: make test-wasm-others
  wasm-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: js/wasm storage package under its own timeout (the make test gate's wasm leg)
        run: make test-wasm-storage
